name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build plugin
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-dist
        path: dist/
        retention-days: 30
        
    - name: Create plugin package structure
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # 创建插件文件夹
        mkdir -p orca-video-info-extract-plugin/dist
        
        # 复制必要文件到插件文件夹
        cp dist/index.js orca-video-info-extract-plugin/dist/
        cp package.json orca-video-info-extract-plugin/
        cp LICENSE orca-video-info-extract-plugin/
        cp icon.svg orca-video-info-extract-plugin/
        cp README.md orca-video-info-extract-plugin/
        
        # 显示插件文件夹结构
        echo "Plugin folder structure:"
        find orca-video-info-extract-plugin -type f | sort
        
    - name: Create plugin ZIP package
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # 从文件夹内部打包，解压后直接得到文件，不含外层目录
        (cd orca-video-info-extract-plugin && zip -r ../orca-video-info-extract-plugin.zip .)
        
        # 显示ZIP内容
        echo "ZIP package contents:"
        unzip -l orca-video-info-extract-plugin.zip
        
    - name: Create or Update Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: orca-video-info-extract-plugin.zip
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
